<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{

html,body{height:100%;}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 30px;border-radius:100px;font-size:.78rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;transition:background .25s,color .25s,border-color .25s;}
.btn.solid{background:var(--cream);color:var(--ink);}
.btn.solid:hover{background:var(--teal);}
.btn.ghost{border:1px solid rgba(250,248,244,.35);color:var(--cream);}
.btn.ghost:hover{border-color:var(--teal);color:var(--teal);}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;}
